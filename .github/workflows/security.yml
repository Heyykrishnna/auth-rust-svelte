name: Security & Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  rust-audit:
    name: Rust — Cargo Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/auth-api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  node-audit:
    name: Node — Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run npm audit
        run: npm audit --workspaces --audit-level=high

  gitleaks:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-scan:
    name: Container & Filesystem Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build auth-api image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: true
          tags: auth-api:scan

      - name: Build web image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          load: true
          tags: web:scan

      - name: Run Trivy on auth-api
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: auth-api:scan
          format: sarif
          output: trivy-auth-api.sarif
          severity: HIGH,CRITICAL

      - name: Run Trivy on web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: web:scan
          format: sarif
          output: trivy-web.sarif
          severity: HIGH,CRITICAL

      - name: Upload auth-api scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-auth-api.sarif
          category: trivy-auth-api

      - name: Upload web scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

      - name: Generate auth-api SBOM (SPDX)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: auth-api:scan
          format: spdx-json
          output: sbom-auth-api.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-auth-api
          path: sbom-auth-api.spdx.json
          retention-days: 90
