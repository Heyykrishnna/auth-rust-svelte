name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  workflow-ci:
    name: Workflows and Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint:1.7.12
      - uses: imranismail/setup-kustomize@v2
      - name: Render Kubernetes overlays
        run: |
          kustomize build infrastructure/kubernetes/dev > /dev/null
          kustomize build infrastructure/kubernetes/prod > /dev/null
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Validate Helm chart
        run: |
          helm lint infrastructure/helm
          helm lint infrastructure/helm -f infrastructure/helm/values-dev.yaml
          helm lint infrastructure/helm -f infrastructure/helm/values-prod.yaml
          helm template auth infrastructure/helm -f infrastructure/helm/values-prod.yaml > /dev/null

  rust-ci:
    name: Rust — Test, Clippy, Fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: authuser
          POSTGRES_PASSWORD: authpassword
          POSTGRES_DB: authdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U authuser -d authdb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6399:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/auth-api
    env:
      TEST_DATABASE_URL: postgres://authuser:authpassword@127.0.0.1:5432/authdb_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/auth-api
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run unit tests
        run: cargo test --locked --all-targets --all-features
      - name: Run database integration tests
        run: cargo test --locked --all-targets --all-features -- --ignored --test-threads=1

  web-ci:
    name: Web & Packages — Check, Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: ESLint
        run: npm run lint
      - name: Vitest suite
        run: npm test
      - name: Production build
        run: npm run build

  docker-build-check:
    name: Docker — Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [workflow-ci, rust-ci, web-ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: auth-api
            dockerfile: docker/Dockerfile.api
          - image: web
            dockerfile: docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: ${{ matrix.image }}:ci-check
      - name: Verify packaged API and worker
        if: matrix.image == 'auth-api'
        run: |
          docker run --rm --entrypoint /usr/bin/test auth-api:ci-check -x /app/auth-api
          docker run --rm --entrypoint /usr/bin/test auth-api:ci-check -x /app/webhook-worker
          for binary in /app/auth-api /app/webhook-worker; do
            if docker run --rm --entrypoint "$binary" auth-api:ci-check > startup.log 2>&1; then
              echo "Expected startup to reject missing database configuration."
              exit 1
            fi
            grep -F "DATABASE_URL must be specified" startup.log
          done
      - name: Verify web runtime entry point
        if: matrix.image == 'web'
        run: |
          docker run --detach --name web-smoke -p 127.0.0.1:3000:3000 web:ci-check
          trap 'docker logs web-smoke; docker rm --force web-smoke' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/login > /dev/null

  publish-images:
    name: Publish Verified Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [docker-build-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image names
        id: images
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "prefix=ghcr.io/$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Publish auth-api and worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          cache-from: type=gha,scope=auth-api
          tags: ${{ steps.images.outputs.prefix }}/auth-api:sha-${{ github.sha }}
      - name: Publish web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          cache-from: type=gha,scope=web
          tags: ${{ steps.images.outputs.prefix }}/web:sha-${{ github.sha }}
