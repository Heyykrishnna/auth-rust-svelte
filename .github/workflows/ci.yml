name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-ci:
    name: Rust — Test, Clippy, Fmt
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: authuser
          POSTGRES_PASSWORD: authpassword
          POSTGRES_DB: authdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/auth-api

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/auth-api

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets
        env:
          DATABASE_URL: postgres://authuser:authpassword@localhost:5432/authdb_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-at-least-32-chars-long

  rust-audit:
    name: Rust — Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/auth-api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  svelte-ci:
    name: Svelte — Check, Lint, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Svelte check
        run: npm -w apps/frontend run check

      - name: ESLint
        run: npm -w apps/frontend run lint

      - name: Run Vitest
        run: npm -w apps/frontend run test

  docker-build-check:
    name: Docker — Build Check
    runs-on: ubuntu-latest
    needs: [rust-ci, svelte-ci]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build auth-api image
        uses: docker/build-push-action@v6
        with:
          context: apps/auth-api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: auth-api:ci-check

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: frontend:ci-check

  trivy-scan:
    name: Trivy — Image Security Scan
    runs-on: ubuntu-latest
    needs: docker-build-check
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build auth-api for scanning
        uses: docker/build-push-action@v6
        with:
          context: apps/auth-api
          push: false
          load: true
          tags: auth-api:scan

      - name: Run Trivy on auth-api
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: auth-api:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
