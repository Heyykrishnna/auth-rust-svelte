name: Deploy — Update Manifests

on:
  workflow_run:
    workflows: ["Build & Push Docker Images"]
    types: [completed]
    branches: [main]

jobs:
  update-manifests:
    name: Update K8s Image Tags in Git
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Derive image SHA tag
        id: sha
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Update auth-api image tag in prod overlay
        run: |
          cd infra/k8s/overlays/prod
          kustomize edit set image \
            auth-api=ghcr.io/${{ github.repository_owner }}/auth-api:${{ steps.sha.outputs.tag }}

      - name: Update frontend image tag in prod overlay
        run: |
          cd infra/k8s/overlays/prod
          kustomize edit set image \
            frontend=ghcr.io/${{ github.repository_owner }}/frontend:${{ steps.sha.outputs.tag }}

      - name: Commit and push manifest update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/overlays/prod/kustomization.yaml
          # Exit 0 when there is nothing to commit (idempotent re-runs)
          git diff --staged --quiet && echo "No manifest changes — skipping commit" && exit 0
          git commit -m "chore(deploy): bump image tags to ${{ steps.sha.outputs.tag }} [skip ci]"
          git push

      - name: Deployment summary
        run: |
          echo "## GitOps Manifest Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image tag** | \`${{ steps.sha.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Overlay** | \`infra/k8s/overlays/prod\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Argo CD** | Polling Git — auto-sync within ~3 min |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Argo CD watches this repo and will reconcile the cluster automatically." >> $GITHUB_STEP_SUMMARY
          echo "> No imperative \`kubectl apply\` or \`argocd app sync\` is needed." >> $GITHUB_STEP_SUMMARY
