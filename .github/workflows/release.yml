name: Deploy — Update GitOps Manifests

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GHCR tag to deploy (sha-<full commit SHA> or v1.0.0)"
        required: true
        type: string
  workflow_run:
    workflows: ["CI", "Security & Compliance"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-manifests
  cancel-in-progress: false

jobs:
  update-manifests:
    name: Update K8s Image Tags in Git
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    permissions:
      actions: read
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Require CI and security success for the same commit
        id: checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "Skipping stale deployment: source commit is no longer the main branch head."
            exit 0
          fi
          for workflow in ci.yml security.yml; do
            conclusion=$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?head_sha=$SOURCE_SHA&event=push&branch=main&per_page=1" --jq '.workflow_runs[0].conclusion')
            if [[ "$conclusion" != success ]]; then
              echo "$workflow has not succeeded for $SOURCE_SHA; waiting for its completion event."
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f
        if: steps.checks.outputs.ready == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: steps.checks.outputs.ready == 'true'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        if: steps.checks.outputs.ready == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate tag and verify both published images
        if: steps.checks.outputs.ready == 'true'
        id: images
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          tag="$INPUT_TAG"
          if [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            tag="sha-$SOURCE_SHA"
          fi
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid container image tag."
            exit 1
          fi
          prefix="ghcr.io/$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools inspect "$prefix/auth-api:$tag" > /dev/null
          docker buildx imagetools inspect "$prefix/web:$tag" > /dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
      - name: Update production image tags
        if: steps.checks.outputs.ready == 'true'
        env:
          IMAGE_TAG: ${{ steps.images.outputs.tag }}
          IMAGE_PREFIX: ${{ steps.images.outputs.prefix }}
        working-directory: infrastructure/kubernetes/prod
        run: |
          kustomize edit set image "auth-api=$IMAGE_PREFIX/auth-api:$IMAGE_TAG" "frontend=$IMAGE_PREFIX/web:$IMAGE_TAG"
          kustomize build . > /dev/null
      - name: Commit and push manifest update
        if: steps.checks.outputs.ready == 'true'
        env:
          IMAGE_TAG: ${{ steps.images.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/kubernetes/prod/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No manifest changes."
            exit 0
          fi
          git commit -m "chore(deploy): bump production images to $IMAGE_TAG [skip ci]"
          git push origin HEAD:main
      - name: Deployment summary
        if: steps.checks.outputs.ready == 'true'
        env:
          IMAGE_TAG: ${{ steps.images.outputs.tag }}
        run: |
          {
            echo "## GitOps Manifest Update"
            echo "Production manifest images updated to: $IMAGE_TAG"
            echo "Cluster rollout must be verified in Argo CD."
          } >> "$GITHUB_STEP_SUMMARY"
