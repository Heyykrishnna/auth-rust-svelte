services:
  auth-api:
    build:
      target: builder
    command: cargo watch -x run
    volumes:
      - ./apps/auth-api:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - target_cache:/app/target
    environment:
      RUST_LOG: auth_api=trace,tower_http=trace,sqlx=debug

  web:
    build:
      target: builder
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      PUBLIC_API_BASE_URL: http://localhost:8080

volumes:
  cargo_registry:
  cargo_git:
  target_cache:
