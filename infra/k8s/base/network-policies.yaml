apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-isolation
  namespace: data
  labels:
    app.kubernetes.io/name: data-isolation
    app.kubernetes.io/part-of: auth-rust-svelte
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: auth
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-isolation
  namespace: auth
  labels:
    app.kubernetes.io/name: auth-isolation
    app.kubernetes.io/part-of: auth-rust-svelte
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: observability
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: data
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: observability
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-isolation
  namespace: observability
  labels:
    app.kubernetes.io/name: observability-isolation
    app.kubernetes.io/part-of: auth-rust-svelte
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: auth
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - podSelector: {}
