apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev overlay — lower replicas, debug logging, local images
resources:
  - ../../base

patches:
  # Lower replicas for dev
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: frontend
      namespace: auth

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: auth-api
      namespace: auth

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: auth-worker
      namespace: auth

  # Debug logging for auth-api
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "auth_api=debug,tower_http=debug,sqlx=debug"
    target:
      kind: Deployment
      name: auth-api
      namespace: auth

images:
  - name: frontend
    newTag: dev
  - name: auth-api
    newTag: dev
