# ServiceMonitor for Prometheus Operator to scrape auth-api metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-api-monitor
  namespace: observability
  labels:
    app.kubernetes.io/name: auth-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-api
  namespaceSelector:
    matchNames:
      - auth-system
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
