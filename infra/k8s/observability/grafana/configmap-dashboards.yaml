apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  auth-api.json: |
    {
      "title": "Auth API — Overview",
      "uid": "auth-api-overview",
      "timezone": "browser",
      "refresh": "30s",
      "panels": [
        {
          "title": "Request Rate (rps)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [{
            "expr": "sum(rate(http_requests_total{job=\"auth-api\"}[1m]))",
            "legendFormat": "requests/sec"
          }],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }
        },
        {
          "title": "Error Rate (%)",
          "type": "stat",
          "datasource": "Prometheus",
          "targets": [{
            "expr": "sum(rate(http_requests_total{job=\"auth-api\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"auth-api\"}[5m])) * 100",
            "legendFormat": "Error %"
          }],
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 }
        },
        {
          "title": "p99 Latency (ms)",
          "type": "stat",
          "datasource": "Prometheus",
          "targets": [{
            "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=\"auth-api\"}[5m])) by (le)) * 1000",
            "legendFormat": "p99 ms"
          }],
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 }
        },
        {
          "title": "Active Sessions (Redis)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [{
            "expr": "auth_active_sessions_total",
            "legendFormat": "sessions"
          }],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 }
        },
        {
          "title": "Login Success vs Failed",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(rate(auth_login_success_total[5m]))",
              "legendFormat": "success"
            },
            {
              "expr": "sum(rate(auth_login_failed_total[5m]))",
              "legendFormat": "failed"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 }
        }
      ]
    }
