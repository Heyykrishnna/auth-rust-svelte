global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: auth-api
    static_configs:
      - targets: [auth-api:8080]
    metrics_path: /metrics

  - job_name: webhook-worker
    static_configs:
      - targets: [webhook-worker:9091]
    metrics_path: /metrics

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
