apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../base

images:
- name: auth-api
  newName: ghcr.io/heyykrishnna/auth-api
  newTag: sha-93dec543533208f5f1efc6959b13426ee74cc93d
- name: frontend
  newName: ghcr.io/heyykrishnna/web
  newTag: sha-93dec543533208f5f1efc6959b13426ee74cc93d



patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: frontend
    namespace: auth
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: auth-api
    namespace: auth
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: auth-worker
    namespace: auth
