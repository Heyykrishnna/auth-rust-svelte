apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../base

images:
- name: auth-api
  newName: ghcr.io/heyykrishnna/auth-api
  newTag: sha-82f06b55bb2026b80325f9ef5a2904d17247f212
- name: frontend
  newName: ghcr.io/heyykrishnna/web
  newTag: sha-82f06b55bb2026b80325f9ef5a2904d17247f212



patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: frontend
    namespace: auth
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: auth-api
    namespace: auth
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: auth-worker
    namespace: auth
