apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../base

images:
- name: auth-api
  newName: ghcr.io/heyykrishnna/auth-api
  newTag: sha-04ebd62c2e0d3b38cc16d96460202b1427ecbed3
- name: frontend
  newName: ghcr.io/heyykrishnna/web
  newTag: sha-04ebd62c2e0d3b38cc16d96460202b1427ecbed3



patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: frontend
    namespace: auth
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: auth-api
    namespace: auth
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: auth-worker
    namespace: auth
