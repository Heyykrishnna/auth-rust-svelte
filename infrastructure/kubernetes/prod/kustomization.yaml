apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../base

images:
- name: auth-api
  newName: ghcr.io/heyykrishnna/auth-api
  newTag: sha-46f9c205c8bd4871c51cf1fb65d32889c80a5bfb
- name: frontend
  newName: ghcr.io/heyykrishnna/web
  newTag: sha-46f9c205c8bd4871c51cf1fb65d32889c80a5bfb



patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: frontend
    namespace: auth
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: auth-api
    namespace: auth
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: auth-worker
    namespace: auth
