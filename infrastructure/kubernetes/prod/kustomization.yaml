apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../base

images:
- name: auth-api
  newName: ghcr.io/heyykrishnna/auth-api
  newTag: sha-156d3654a069d35214e7931f9432f888e30350f6
- name: frontend
  newName: ghcr.io/heyykrishnna/web
  newTag: sha-156d3654a069d35214e7931f9432f888e30350f6



patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: frontend
    namespace: auth
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: auth-api
    namespace: auth
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: auth-worker
    namespace: auth
