apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-api-secrets
  namespace: auth
  labels:
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: auth-rust-svelte
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: auth-api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2

  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: auth-api
        property: DATABASE_URL

    - secretKey: REDIS_URL
      remoteRef:
        key: auth-api
        property: REDIS_URL

    - secretKey: JWT_SECRET
      remoteRef:
        key: auth-api
        property: JWT_SECRET

    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: auth-api
        property: GOOGLE_CLIENT_ID

    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: auth-api
        property: GOOGLE_CLIENT_SECRET

    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: auth-api
        property: GITHUB_CLIENT_ID

    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: auth-api
        property: GITHUB_CLIENT_SECRET
