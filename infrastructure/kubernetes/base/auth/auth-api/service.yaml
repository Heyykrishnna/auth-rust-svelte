apiVersion: v1
kind: Service
metadata:
  name: auth-api
  labels:
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: auth-rust-svelte
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: http-alt
      port: 80
      targetPort: http
      protocol: TCP
