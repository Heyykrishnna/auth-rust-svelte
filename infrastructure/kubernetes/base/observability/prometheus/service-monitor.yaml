apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-api-monitor
  namespace: observability
  labels:
    app.kubernetes.io/name: auth-api
    app.kubernetes.io/part-of: auth-rust-svelte
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-api
  namespaceSelector:
    matchNames:
      - auth
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
